name: Verify benchmark harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg bubblewrap
          sudo mkdir -p /workspace
          python -m pip install -r requirements.txt
      - name: Run offline tests without model calls
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Verify namespaces with hosted-runner privileges
        run: sudo --preserve-env=LD_LIBRARY_PATH "$(command -v python)" -m unittest discover -s tests -p test_isolation.py -v
      - name: Render and validate synthetic sample without model calls
        run: python lab.py smoke
